<!DOCTYPE HTML>
<html>

	<head>
		<meta charset="utf-8">
		<title>File Upload Demo</title>
	</head>

	<body>
		<p>Before the script...</p>
		<!-- Change the path/to/js-file to your real file path-->
		<form name="uploadForm" action="http://localhost:8082/upload" method="post" enctype="multipart/form-data">

			<div>
				<input id="uploadInput" name="file" type="file" multiple>
				<label for="fileNum">Selected files:</label>
				<output id="fileNum">0</output>
				<label for="fileSize">Total size:</label>
				<output id="fileSize">0</output>
			</div>
			<div>
				<input type="submit" value="Send File">
			</div>
		</form>
		<script src="upload.js"></script>
		<p>After script</p>
	</body>
</html>
