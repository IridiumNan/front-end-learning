<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="utf-8">
		<title>样式引入demo-内部样式</title>

		<style>
			h1 {
				color: red;
				font-size: 50px;
			}
			
			p {
				color: orange;
				font-size: 15px;
			}
		</style>
	</head>

	<body>
		<h1>全局样式(红)</h1>
		<h1 style="color: blue;">内联样式(蓝)</h1>

		<p>段落一</p>
		<p>段落二</p>
	</body>
</html>
