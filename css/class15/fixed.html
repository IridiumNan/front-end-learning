<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="utf-8">
		<title>标题内容</title>

		<style>
			h2 {
				height: 500px;
			}
			
			.fix-box {
				width: 200px;
				height: 200px;
				
				background-color: aqua;
				
				font-size: 20px;
				
				color: red;
				
				position: fixed;
				
				right: 100px;
				top: 100px;
				
				text-align: center;
				align-content: center;
			}
			
			p {
				font-size: 30px;
				color: red;
			}
		</style>
	</head>

	<body>
		<h2>这是一个H2 标签, 高度为500px</h2>
		<p>请向下滑动</p>
		<h2>这是一个H2 标签, 高度为500px</h2>
		<p>请向下滑动</p>
		<h2>这是一个H2 标签, 高度为500px</h2>
		<p>请向下滑动</p>
		<h2>这是一个H2 标签, 高度为500px</h2>
		<p>请向下滑动</p>
		<h2>这是一个H2 标签, 高度为500px</h2>
		<p>请向下滑动</p>
		<h2>这是一个H2 标签, 高度为500px</h2>
		<p>请向下滑动</p>
		<h2>这是一个H2 标签, 高度为500px</h2>
		<p>请向下滑动</p>
		<h2>这是一个H2 标签, 高度为500px</h2>

		<div class="fix-box">
			我是固定不动的
		</div>
	</body>
</html>
