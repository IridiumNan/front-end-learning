<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="utf-8">
		<title>Position Relative Demo</title>

		<style>
			.common-box {
				width: 300px;
				height: 300px;
				
				background-color: black;
			}
			
			.box {
				
				width: 200px;
				height: 200px;
				
				background-color: aqua;
				
				/* 相对于上一个元素的位置*/
				position: relative;
				
				top: 100px;
				left: 100px;
			}
		</style>
	</head>

	<body>

		<div class="common-box">
		</div>
		<div class="box">
		</div>
	</body>
</html>
