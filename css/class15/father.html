<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="utf-8">
		<title>Father Position Demo</title>

		<style>
			.container {
				width: 400px;
				height: 400px;
				
				background-color: #888;
				
				position: relative;
				
				margin-left: 200px;
			}
			
			.box {
				width: 200px;
				height: 200px;
				
				background-color: aqua;
				
				position: absolute;
				
				left: 100px;
				top: 100px;
			}
		</style>
	</head>

	<body>
		<div class="container">

			<div class="box">
			</div>
		</div>
	</body>
</html>
