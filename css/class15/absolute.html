<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="utf-8">
		<title>Posotion Absolute Demo</title>
		<style>
			#box1 {
				width: 100px;
				height: 100px;
				
				background-color: yellow;
				
				position: absolute;
				
				left: 200px;
				
				top: 100px;
			}
			
			#box2 {
				width: 100px;
				height: 100px;
				
				background-color: aqua;
				
				position: absolute;
				
				left: 150px;
				top: 80px;
				
			}
			
			div {
				width: 300px;
				height: 300px;
				
				background-color: #999;
			}
		</style>
	</head>

	<body>

		每增加一个 absolute 都会新增一个图层， 可以相互覆盖
		<div></div>
		<div id="box1"></div>
		<div id="box2"></div>
	</body>
</html>
