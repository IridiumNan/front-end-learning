<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="utf-8">
		<title>border-radius demo</title>

		<style>
			.box {
				width: 300px;
				height: 300px;
				
				background-color: aqua;
				
				margin: 0 auto;
				margin-bottom: 100px;
			}
			
			.radius {
				border-radius: 20px;
			}
			
			.circle {
				border-radius: 100%;
			}
		</style>
	</head>

	<body>

		<div class="box">
		</div>

		<div class="box radius">
		</div>

		<div class="box circle">
		</div>
	</body>
</html>
