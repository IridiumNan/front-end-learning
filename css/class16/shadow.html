<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="utf-8">
		<title>Shadown Demo</title>

		<style>
			.box {
				width: 300px;
				height: 300px;
				
				background-color: blueviolet;
				
				margin: 0 auto;
				
				margin-bottom: 100px;
			}
			
			.with-shadow {
				box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.4);
			}
		</style>
	</head>

	<body>

		<div class="box">
		</div>

		<div class="box with-shadow">
		</div>
	</body>
</html>
