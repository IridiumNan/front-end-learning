<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="utf-8">
		<title>类选择器demo</title>

		<style>
			.color-red {
				color: red;
			}
			
			.size-30 {
				font-size: 30px;
			}
		</style>
	</head>

	<body>

		<p>大家好</p>
		<p>我很好</p>
		<p class="color-red">我emo了</p>

		<p>我也emo了</p>

		放在同一个class属性当中， 不同的类使用空格隔开
		<p class="color-red size-30">emo 就多写代码</p>
	</body>
</html>
