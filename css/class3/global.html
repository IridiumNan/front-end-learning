<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>全局选择器</title>
        <style>
        /* 将所有的元素都设置为 18px 大小，红色 */
        *{
            font-size: 18px;
            color: red;
        }
        </style>
    </head>
    <body>

        所有元素的样式都为红色， 大小为 18px
        <br>
        <p>p 标签</p>

        <h1>h1 标签</h1>
        <h2>h2 标签</h2>


        <ol>
            <li>元素一</li>
            <li>元素二</li>

        </ol>
    </body>
</html>
