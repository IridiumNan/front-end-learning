<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="utf-8">
		<title>元素选择器</title>

		<style>
			/* 设置所有的 p 标签都为 22px, 粉色 */
			p {
				font-size: 22px;
				color: pink;
			}
			
			/* span 标签内部的设置为红色， 用于特殊字段的强调 */
			span {
				color: red;
			}
		</style>
	</head>

	<body>
		<h1>元素选择器案例</h1>

		<p>这是一个段落 p 标签</p>

		<p>这是另一个段落</p>

		<p>btw I use <span>windows</span></p>
		<p>btw I use <span>arch</span></p>
		<p>btw I use <span>nixos</span></p>

		<div>
			<ul>
				<li>
					<p>这是 p 标签的内容</p>
				</li>
			</ul>
		</div>
	</body>
</html>
