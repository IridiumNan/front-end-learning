<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="utf-8">
		<title>Table 属性</title>
		<link rel="stylesheet" type="text/css" href="./table.css">
	</head>

	<body>
		<p>td (单元格)无边框</p>
		<table id="table1">
			<tr>
				<td>Nixos</td>
				<td>Arch</td>
			</tr>
			<tr>
				<td>Fedora</td>
				<td>Ubuntu</td>
			</tr>
		</table>
		<p>td 有边框</p>

		<table id="table2">
			<tr>
				<td>Nixos</td>
				<td>Arch</td>
			</tr>
			<tr>
				<td>Fedora</td>
				<td>Ubuntu</td>
			</tr>
		</table>

		<p>边框折叠(常用)</p>
		<table id="table3">
			<tr>
				<td>Nixos</td>
				<td>Arch</td>
			</tr>
			<tr>
				<td>Fedora</td>
				<td>Ubuntu</td>
			</tr>
		</table>

		<p>指定高度宽度 500px * 500px</p>
		<table id="table4">
			<tr>
				<td>Nixos</td>
				<td>Arch</td>
			</tr>
			<tr>
				<td>Fedora</td>
				<td>Ubuntu</td>
			</tr>
		</table>
		<p>Padding 填充</p>

		<table id="table5">
			<tr>
				<td>Nixos</td>
				<td>Arch</td>
			</tr>
			<tr>
				<td>Fedora</td>
				<td>Ubuntu</td>
			</tr>
		</table>

		<p>背景</p>
		<table id="table6">
			<tr>
				<td>Nixos</td>
				<td>Arch</td>
			</tr>
			<tr>
				<td>Fedora</td>
				<td>Ubuntu</td>
			</tr>
		</table>
	</body>
</html>
