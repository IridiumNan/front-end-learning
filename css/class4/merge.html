<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>合并选择器</title>

        <style>
        /* 同时将 h3 标签和 p 标签的颜色都设置为蓝色 */
        h3, p{
            color: blue;
        }
        </style>
    </head>
    <body>
        <h3>我是H3 标签</h3>
        <p>我是 p 标签</p>
    </body>
</html>
