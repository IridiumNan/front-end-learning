<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
		<title>媒体查询</title>

		<style>
			.box {
				width: 300px;
				height: 300px;
			}
			
			/* mobile device */
			@media screen and (max-width: 768px) {
				.box {
					background-color: red;
				}
				
				.p1 {
					display: none;
				}
				
				.p2 {
					display: none;
				}
			}
			
			/* table */
			@media screen and (min-width: 768px) and (max-width: 992px) {
				.box {
					background-color: aqua;
				}
				
				.p1 {
					display: none;
				}
				
				.p2 {
					display: block;
				}
			}
			
			/* PC */
			@media screen and (min-width: 992px) {
				.box {
					background-color: blue;
				}
				
				.p1 {
					display: block;
				}
				
				.p2 {
					display: block;
				}
			}
		</style>
	</head>

	<body>
		<div class="box">
		</div>

		<p class="p1">P1 标签</p>
		<p class="p2">P2 标签</p>
	</body>
</html>
