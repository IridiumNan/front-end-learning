<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="utf-8">
		<title>Box Demo</title>

		<style>
			#box1 {
				
				width: 100px;
				height: 100px;
				
				background-color: yellow;
				
				/* 第一个值上下， 第二个值左右*/
				padding: 50px 80px;
				
				/* 也可以使用下面的方式来控制四个方向上的边距*/
				/* padding-left: 30px; */
				/* padding-right: 20px; */
				/* padding-top: 50px; */
				/* padding-bottom: 25px; */
				
				border: 5px solid blue;
				
				/* 跟周围盒子的距离*/
				margin: 20px 30px;
				
				align-content: center;
			}
		</style>
	</head>

	<body>
		<div id="box1">
			我是内容
		</div>
	</body>
</html>
