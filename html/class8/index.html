<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="utf-8">
		<title>无序列表demo</title>
	</head>

	<body>

		<ul type="disc">
			<li>Nixos</li>
			<li>ArchLinux</li>
			<li>fedora</li>
			<li>ubuntu</li>
		</ul>

		<ul type="circle">
			<li>Nixos</li>
			<li>ArchLinux</li>
			<li>fedora</li>
			<li>ubuntu</li>
		</ul>

		<ul type="square">
			<li>Nixos</li>
			<li>ArchLinux</li>
			<li>fedora</li>
			<li>ubuntu</li>
		</ul>

		<ul type="none">
			<li>Nixos</li>
			<li>ArchLinux</li>
			<li>fedora</li>
			<li>ubuntu</li>
		</ul>

		<p>操作系统</p>
		<ul>
			<li>Windows</li>
			<li>macOS</li>
			<li>
				GNU/Linux
				<ul>
					<li>Nixos</li>
					<li>ArchLinux</li>
					<li>fedora</li>
					<li>ubuntu</li>
				</ul>
			</li>
		</ul>
	</body>
</html>
