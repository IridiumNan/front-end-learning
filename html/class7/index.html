<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="utf-8">
		<title>有序列表demo</title>
	</head>

	<body>
		<p><strong>多重标号方式</strong></p>
		<ol type="1">
			<li>苹果</li>
			<li>橘子</li>
			<li>菠萝</li>
			<li>柚子</li>
		</ol>

		<ol type="a">
			<li>苹果</li>
			<li>橘子</li>
			<li>菠萝</li>
			<li>柚子</li>
		</ol>

		<ol type="A">
			<li>苹果</li>
			<li>橘子</li>
			<li>菠萝</li>
			<li>柚子</li>
		</ol>

		<ol type="i">
			<li>苹果</li>
			<li>橘子</li>
			<li>菠萝</li>
			<li>柚子</li>
		</ol>

		<ol type="I">
			<li>苹果</li>
			<li>橘子</li>
			<li>菠萝</li>
			<li>柚子</li>
		</ol>
		<br>
		<p><strong>嵌套列表</strong></p>

		<ol>
			<li>水果</li>
			<li>
				蔬菜
				<ol>
					<li>白菜</li>
					<li>油菜</li>
					<li>黄瓜</li>
				</ol>
			</li>
			<li>肉类</li>
		</ol>
	</body>
</html>
