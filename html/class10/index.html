<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>合并表格demo</title>
    </head>
    <body>

        <table border="1px" width="400px" height="300px">
            <tr>
                <td>单元格1</td>
                <td>单元格2</td>
                <td>单元格3</td>
                <td>单元格4</td>
                <td>单元格5</td>
            </tr>
            <tr>
                <td>单元格6</td>
                <td>单元格7</td>
                <td>单元格8</td>
                <td>单元格9</td>
                <td>单元格10</td>
            </tr>
            <tr>
                <td>单元格11</td>
                <td>单元格12</td>
                <td>单元格13</td>
                <td>单元格14</td>
                <td>单元格15</td>
            </tr>
            <tr>
                <td>单元格16</td>
                <td>单元格17</td>
                <td>单元格18</td>
                <td>单元格19</td>
                <td>单元格20</td>
            </tr>
        </table>

        <hr color="blue" width="800px" size="2px" align="left"/>

        <table border="1px" width="400px" height="300px">
            <tr>
                <td colspan="3">单元格1, 2, 3</td>
                <td>单元格4</td>
                <td>单元格5</td>
            </tr>
            <tr>
                <td rowspan="2">单元格6, 11</td>
                <td>单元格7</td>
                <td>单元格8</td>
                <td colspan="2" rowspan="2">单元格9, 10, 14, 15</td>
            </tr>
            <tr>
                <td>单元格12</td>
                <td>单元格13</td>
            </tr>
            <tr>
                <td>单元格16</td>
                <td>单元格17</td>
                <td>单元格18</td>
                <td>单元格19</td>
                <td>单元格20</td>
            </tr>
        </table>
    </body>
</html>
